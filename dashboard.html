<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issues Tracker</title>
    <!-- tailwind+daisyui -->
     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- google fonts -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Hind+Siliguri:wght@300;400;500;600;700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <!-- font awesome -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- stylesheet -->
     <link rel="stylesheet" href="./style/style.css">
</head>
<body class="bg-gray-100">

<!-- Navbar -->

<div class="bg-white shadow p-4 flex justify-between gap-2">
<div class="flex  items-center gap-3">
    <img src="./assets/github-logo.png" class="w-8">
<h1 class="font-bold text-xl">GitHub Issues Tracker</h1>
</div>

<div>
<input id="searchInput" class="border p-1 rounded" placeholder="Search issue"/>
<button onclick="searchIssue()" class="bg-blue-500 text-white px-3 py-1 rounded">+New Issues</button>
</div>

</div>


<!-- Tabs -->

<div class="flex gap-4 p-4">

<button onclick="loadIssues('all')" id="allBtn" class="tabBtn bg-blue-500 text-white px-4 py-2 rounded">All</button>

<button onclick="loadOpen('open')" id="openBtn" class="tabBtn bg-gray-200 px-4 py-2 rounded">Open</button>

<button onclick="loadClosed('Closed')" id="closedBtn" class="tabBtn bg-gray-200 px-4 py-2 rounded">Closed</button>

</div>

<!-- all issues -->
 <div class="flex justify-between">
    <div class="flex items-center gap-1">
        <div><img src="./assets/Aperture.png" alt=""></div>
        <div class="px-2 mb-2">
            <h2 class="text-xl text-neutral-900 font-semibold mb-2">
            <span id="issueCount"></span> Issues</h2>
            <p>Track and manage your project issues</p>
        </div>
    </div>
    <div class="flex text-center gap-6">
        <p><i class="fa-solid fa-circle"></i>Open</p>
        <p><i class="fa-solid fa-circle"></i>Closed</p>
    </div>
</div>


<!-- Loader -->

<div id="loader" class="text-center hidden">
Loading...
</div>

<!-- Issues Container -->

<div id="issuesContainer"
class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 p-4">

</div>


<!-- Modal -->

<div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center">

<div class="bg-white p-6 w-96 rounded">

<h2 id="modalTitle" class="text-xl font-bold"></h2>
<p id="modalDesc"></p>

<p id="modalStatus"></p>
<p id="modalAuthor"></p>
<p id="modalPriority"></p>
<p id="modalLabel"></p>

<button onclick="closeModal()" class="mt-4 bg-red-500 text-white px-3 py-1 rounded">
Close
</button>

</div>

</div>

<script src="./script.js"></script>

</body>
</html>
