<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <!-- Tailwind+DaisyUI -->
     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- google fonts -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Hind+Siliguri:wght@300;400;500;600;700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <!-- font awesome -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

     <!-- stylesheet -->
      <link rel="stylesheet" href="./style/style.css">
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">
    <div class="card w-96 bg-white shadow-xl p-6">
        <!-- logo -->
         <div class="flex justify-center mb-4">
            <img src="./assets/github-logo.png" class="w-12">
         </div>
         <!-- title -->
          <h2 class="text-center text-neutral-950 text-2xl font-bold">GitHub Issues Tracker</h2>
          <p class="text-center text-gray-500 text-sm mb-4">Sign in to manage your issues</p>

          <!-- username -->
         <label class="label">
            <span class="label-text text-neutral-800 font-bold">Username</span>
         </label>
         <input id="user" type="text" placeholder="Enter Username" class="input input-bordered  w-full">

         <p class="text-xs text-blue-500 mt-1 mb-3">Default: admin</p>
          <!-- password -->
         <label class="label">
            <span class="label-text  text-neutral-800 font-bold">Password</span>
         </label>
         <input id="pass" type="password" placeholder="Enter Password" class="input input-bordered w-full">

         <p class="text-xs text-blue-500 mt-1 mb-3">Default: admin123</p>

         <button onclick="login()" class="btn btn-primary w-full">Sign In</button>
        <p id="error" class="text-red-500 text-center mt-2"></p>
         <!-- divider -->
          <div class="divider">OR</div>

          <!-- Demo credentials -->
           <div class="text-center text-sm">
            <p class="font-semibold">Demo Credentials</p>
            <p>Username: admin</p>
            <p>Password: admin123</p>
           </div>

    </div>
<script src="./script.js"></script>
</body>
</html>
